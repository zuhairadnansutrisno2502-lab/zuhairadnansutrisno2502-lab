<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" role="img" aria-labelledby="t">
  <title id="t">Xianying — hobby developer from Indonesia. Small CLI tools around git, and Roblox games in Luau.</title>
  <defs>
    <clipPath id="frame"><rect width="800" height="280" rx="16"/></clipPath>
    <filter id="aurora" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .drift1 { animation: drift1 18s ease-in-out infinite alternate; }
    .drift2 { animation: drift2 22s ease-in-out infinite alternate; }
    .flow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 14 200; animation: flow 6s ease-in-out infinite; }
    .f2 { animation-delay: 1.2s; } .f3 { animation-delay: 2.4s; }
    .ping { opacity: 0; animation: ping 6s ease-in-out infinite; }
    @keyframes drift1 { to { transform: translate(-110px, 50px); } }
    @keyframes drift2 { to { transform: translate(70px, -60px); } }
    @keyframes flow { from { stroke-dashoffset: 14; } 70%, to { stroke-dashoffset: -100; } }
    @keyframes ping { 0%, 100% { opacity: 0; } 8% { opacity: .9; } 30% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="800" height="280" fill="#0a0d12"/>
    <g filter="url(#aurora)">
      <ellipse class="drift1" cx="660" cy="40" rx="190" ry="110" fill="#a371f7" opacity=".32"/>
      <ellipse class="drift2" cx="720" cy="270" rx="170" ry="100" fill="#39c5cf" opacity=".2"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="799" height="279" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- text -->
  <text class="sans" x="48" y="86" font-size="13" font-weight="600" letter-spacing="2.5" fill="#7d8590">HOBBY DEVELOPER  ·  INDONESIA</text>
  <text class="sans" x="45" y="152" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">Xianying</text>
  <text class="sans" x="48" y="198" font-size="22" fill="#9da7b3">Small CLI tools around <tspan fill="#e6edf3">git</tspan>,</text>
  <text class="sans" x="48" y="229" font-size="22" fill="#9da7b3">and Roblox games in <tspan fill="#e6edf3">Luau</tspan>.</text>

  <!-- git graph: history flowing left to right, merging into main -->
  <g stroke="#30363d" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M500 150 H760"/>
    <path d="M545 150 C575 150 575 95 605 95 H655 C685 95 685 150 715 150"/>
    <path d="M600 150 C625 150 625 205 650 205 H665 C690 205 690 150 715 150"/>
  </g>
  <path class="flow" pathLength="100" stroke="#39c5cf" d="M500 150 H760"/>
  <path class="flow f2" pathLength="100" stroke="#a371f7" d="M545 150 C575 150 575 95 605 95 H655 C685 95 685 150 715 150"/>
  <path class="flow f3" pathLength="100" stroke="#a371f7" d="M600 150 C625 150 625 205 650 205 H665 C690 205 690 150 715 150"/>

  <g fill="#39c5cf" filter="url(#soft)">
    <circle class="ping" cx="545" cy="150" r="9" style="animation-delay:.9s"/>
    <circle class="ping" cx="715" cy="150" r="9" style="animation-delay:3.4s"/>
    <circle class="ping" cx="760" cy="150" r="9" style="animation-delay:4s"/>
  </g>
  <g fill="#a371f7" filter="url(#soft)">
    <circle class="ping" cx="615" cy="95" r="9" style="animation-delay:2s"/>
    <circle class="ping" cx="655" cy="95" r="9" style="animation-delay:2.6s"/>
    <circle class="ping" cx="657" cy="205" r="9" style="animation-delay:3.4s"/>
  </g>
  <g fill="#0a0d12" stroke-width="2">
    <circle cx="500" cy="150" r="5" stroke="#6e7681"/>
    <circle cx="545" cy="150" r="5" stroke="#6e7681"/>
    <circle cx="600" cy="150" r="5" stroke="#6e7681"/>
    <circle cx="615" cy="95" r="5" stroke="#a371f7"/>
    <circle cx="655" cy="95" r="5" stroke="#a371f7"/>
    <circle cx="657" cy="205" r="5" stroke="#a371f7"/>
    <circle cx="715" cy="150" r="6" stroke="#39c5cf"/>
    <circle cx="760" cy="150" r="6" stroke="#39c5cf" fill="#39c5cf"/>
  </g>
  <text class="mono" x="760" y="178" text-anchor="middle" font-size="12" fill="#7d8590">main</text>
</svg>
